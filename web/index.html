<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentinel Eye</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2334d399' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2334d399'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<!-- Installable app (Mac Dock via Safari "Add to Dock" or Chrome/Edge's install button; iPad/iPhone Home
     Screen via Share > Add to Home Screen) — README's "Install as an app" section covers each platform.
     manifest.json + this icon/meta set is what makes the browser offer it and what the installed window
     looks like; sw.js (registered from main.js) is what makes Chrome/Edge actually consider it installable
     at all, not just Safari's older (manifest-independent) Add-to-Home-Screen/Add-to-Dock mechanism. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e13">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sentinel Eye">
<!-- "black": iOS reserves an opaque status-bar strip above our content instead of overlaying a translucent
     one on top of it. "black-translucent" looks tempting since this app already handles env(safe-area-
     inset-*) for true (Fullscreen API) fullscreen elsewhere, but in *standalone* display mode it makes iOS
     itself draw a frosted/blurred system bar over our content for legibility — that's the "weirdly blurred"
     strip reported on iPad after adding to the Home Screen. Opaque "black" avoids it entirely and blends in
     since our topbar is already near-black; true fullscreen video views are unaffected (separate API/state,
     still handled by the :fullscreen safe-area rules). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
